spring:
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/resources/
    livereload:
      enabled: true
      port: 35729
  thymeleaf:
    cache: false
    mode: HTML5
    encoding: UTF-8
    # 開發模式：直讀原始碼目錄，修改 HTML 存檔按 F5 即刻生效（免 Rebuild / 免 Copy）
    prefix: file:src/main/resources/templates/
  web:
    resources:
      static-locations: file:src/main/resources/static/,file:csp/csp-portal-web/src/main/resources/static/,classpath:/static/
      cache:
        period: 0
  # DB 連線設定
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/csp?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&rewriteBatchedStatements=true
          username: csp
          password: ILoveJesus1@CSP
          driver-class-name: com.mysql.jdbc.Driver
          type: com.zaxxer.hikari.HikariDataSource
    # SpringBoot 2.0 後預設的 Datasource Pool
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      # JDBC Driver 較舊時需要設定 Test Query, 不然會拋 Exception; 換 driver / DB 後可以拿掉
      connection-test-query: SELECT 1
mybatis-plus:
  configuration:
    cache-enabled: true
    use-generated-keys: true
    default-executor-type: REUSE
    use-actual-param-name: true
server:
  port: 8080


