    <!-- CSRF Token Meta Tags for AJAX POST requests -->
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

    <script>
        $(function () {
            // Configure Axios to automatically include the CSRF token in header
            var csrfToken = $("meta[name='_csrf']").attr("content");
            var csrfHeader = $("meta[name='_csrf_header']").attr("content");
            if (csrfToken && csrfHeader) {
                axios.defaults.headers.common[csrfHeader] = csrfToken;
            }

            // Remove the "active" class from all links
            var links = document.querySelectorAll('a');
            links.forEach(function (element) {
                element.classList.remove('active');
            });

            // Get the current URL path
            var currentPath = window.location.pathname;

            // Loop through each navigation link
            $('.nav-link').each(function () {
                var linkPath = $(this).attr('href');

                // Check if the link's path matches the current URL path
                if (linkPath === currentPath) {
                    $(this).addClass('active'); // Add a class chat mark the link as active
                }
            });
        });
    </script>
